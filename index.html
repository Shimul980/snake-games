<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes softGlow {
            0% { opacity: 0.7; text-shadow: 0 0 5px #4ade80; }
            50% { opacity: 0.9; text-shadow: 0 0 15px #4ade80; }
            100% { opacity: 0.7; text-shadow: 0 0 5px #4ade80; }
        }
        
        .game-active .score-board {
            transform: scale(0.8);
            opacity: 0.8;
            animation: softGlow 2s infinite;
        }
        
        .game-active .control-buttons {
            transform: scale(0.8);
            opacity: 0.8;
        }
        
        .game-active .game-title {
            transform: scale(0.7);
            opacity: 0.6;
            animation: softGlow 2s infinite;
        }
        
        .score-board, .control-buttons, .game-title {
            transition: all 0.5s ease;
        }
        
        .glow-button {
            transition: all 0.3s ease;
            text-shadow: 0 0 10px currentColor;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }
        
        .glow-button:hover {
            text-shadow: 0 0 20px currentColor;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900 p-2">
    <div class="text-center relative w-full max-w-lg">
        <h1 class="game-title text-white text-3xl mb-1">Snake Game</h1>
        <p class="game-title text-white text-xl mb-1">by Shimul</p>
        
        <!-- Score Board -->
        <div class="score-board bg-gray-800 p-1 rounded-lg text-white mb-2 flex justify-center space-x-4">
            <div id="currentScore" class="md:text-xl">Score: 0</div>
            <div id="highScore" class="md:text-xl">High Score: 0</div>
        </div>
        
        <!-- Menu Screen -->
        <div id="menuScreen" class="text-white space-y-4">
            <button id="startBtn" class="bg-green-500 w-48 px-6 py-4 rounded-xl hover:bg-green-600 text-xl font-semibold transition-colors">Start Game</button>
            <div>
                <button id="settingsBtn" class="bg-blue-500 w-48 px-6 py-4 rounded-xl hover:bg-blue-600 text-xl font-semibold transition-colors">Settings</button>
            </div>
        </div>
        
        <!-- Settings Screen -->
        <div id="settingsScreen" class="text-white hidden">
            <div class="mb-8">
                <h2 class="text-xl mb-4">Difficulty Level</h2>
                <div class="space-x-2">
                    <button data-speed="75" class="level-btn bg-red-500 px-6 py-2 rounded hover:bg-red-600">Hard</button>
                    <button data-speed="150" class="level-btn bg-yellow-500 px-6 py-2 rounded hover:bg-yellow-600">Medium</button>
                    <button data-speed="225" class="level-btn bg-green-500 px-6 py-2 rounded hover:bg-green-600">Easy</button>
                </div>
            </div>
            
            <div class="mb-8">
                <h2 class="text-xl mb-4">Control Type</h2>
                <div class="space-y-2">
                    <div class="flex justify-center flex-wrap gap-2">
                        <button id="joystickBtn" class="control-type-btn bg-purple-500 px-6 py-2 rounded hover:bg-purple-600" data-type="joystick">Joystick</button>
                        <button id="arrowsBtn" class="control-type-btn bg-purple-500 px-6 py-2 rounded hover:bg-purple-600" data-type="arrows">Arrows</button>
                        <button id="keyboardBtn" class="control-type-btn bg-purple-500 px-6 py-2 rounded hover:bg-purple-600" data-type="keyboard">Keyboard</button>
                        <button id="touchBtn" class="control-type-btn bg-purple-500 px-6 py-2 rounded hover:bg-purple-600" data-type="touch">Touch</button>
                    </div>
                    <div class="text-sm text-gray-400">
                        <p id="controlDescription" class="mt-2"></p>
                    </div>
                </div>
            </div>

            <button id="settingsBackBtn" class="bg-gray-500 px-6 py-2 rounded hover:bg-gray-600">Back</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div class="control-buttons flex justify-between mb-1">
                <button id="pauseBtn" class="glow-button bg-yellow-500 px-2 py-1 rounded hover:bg-yellow-600">Pause</button>
                <button id="exitBtn" class="glow-button bg-red-500 px-2 py-1 rounded hover:bg-red-600">Exit Game</button>
            </div>
            <div id="gameArea" class="relative">
                <canvas id="gameCanvas" class="bg-gray-800 rounded-lg mx-auto"></canvas>
            </div>
            
            <!-- Mobile Controls -->
            <div id="mobileControls" class="mt-4 md:hidden">
                <!-- Joystick Control -->
                <div id="joystickControl" class="hidden">
                    <div id="controlPad" class="w-[133px] h-[133px] rounded-full bg-gray-700 relative mx-auto touch-none">
                        <div id="joystick" class="w-10 h-10 rounded-full bg-gray-500 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-100">
                            <div class="w-full h-full rounded-full bg-gray-400 opacity-50"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Arrow Controls -->
                <div id="arrowControls" class="hidden">
                    <div class="grid grid-cols-3 gap-4 max-w-[200px] mx-auto">
                        <div></div>
                        <button class="arrow-btn bg-gray-700 h-16 rounded-xl" data-direction="UP">↑</button>
                        <div></div>
                        <button class="arrow-btn bg-gray-700 h-16 rounded-xl" data-direction="LEFT">←</button>
                        <div class="bg-gray-800 h-16 rounded-xl opacity-20"></div>
                        <button class="arrow-btn bg-gray-700 h-16 rounded-xl" data-direction="RIGHT">→</button>
                        <div></div>
                        <button class="arrow-btn bg-gray-700 h-16 rounded-xl" data-direction="DOWN">↓</button>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let baseWidth = Math.min(400, window.innerWidth - 40);
        let baseHeight = Math.min(400, window.innerHeight - 200);
        canvas.width = baseWidth;
        canvas.height = baseHeight;

        // Initialize game variables
        let game;
        let direction = "RIGHT";
        let food;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let snake;
        let isPaused = false;
        let isGameOver = false;
        let gameSpeed = parseInt(localStorage.getItem("snakeGameSpeed")) || 150; // Default medium speed
        let selectedSpeed = gameSpeed;
        let controlType = localStorage.getItem("snakeControlType") || "joystick"; // Default joystick
        let foodEaten = 0;
        let isBonusFood = false;
        let lastBoardExpansion = 0;
        let isSlowMotion = false;
        
        // Display initial high score
        document.getElementById("highScore").textContent = "High Score: " + highScore;

        // Initialize default settings
        function initializeSettings() {
            // Set default speed (medium)
            const speedButtons = document.querySelectorAll(".level-btn");
            speedButtons.forEach(btn => {
                if (parseInt(btn.dataset.speed) === selectedSpeed) {
                    btn.classList.add("ring-2", "ring-white");
                } else {
                    btn.classList.remove("ring-2", "ring-white");
                }
            });

            // Set default control type (joystick)
            const controlButtons = document.querySelectorAll(".control-type-btn");
            controlButtons.forEach(btn => {
                if (btn.dataset.type === controlType) {
                    btn.classList.add("ring-2", "ring-white");
                } else {
                    btn.classList.remove("ring-2", "ring-white");
                }
            });

            // Update control display
            updateControlType(controlType);
        }

        // Call initialize settings on page load
        initializeSettings();

        // Menu handling
        document.getElementById("startBtn").addEventListener("click", startGame);
        document.getElementById("exitBtn").addEventListener("click", endGame);
        document.getElementById("pauseBtn").addEventListener("click", togglePause);
        
        // Settings buttons
        document.getElementById("settingsBtn").addEventListener("click", () => {
            document.getElementById("menuScreen").classList.add("hidden");
            document.getElementById("settingsScreen").classList.remove("hidden");
        });
        
        document.getElementById("settingsBackBtn").addEventListener("click", () => {
            document.getElementById("settingsScreen").classList.add("hidden");
            document.getElementById("menuScreen").classList.remove("hidden");
        });
        
        // Difficulty buttons
        document.querySelectorAll(".level-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const speed = parseInt(e.target.dataset.speed);
                updateDifficulty(speed);
                document.querySelectorAll(".level-btn").forEach(b => {
                    b.classList.remove("ring-2", "ring-white");
                });
                e.target.classList.add("ring-2", "ring-white");
                // Save to localStorage
                localStorage.setItem("snakeGameSpeed", speed);
            });
        });
        
        // Control type buttons
        document.querySelectorAll(".control-type-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const type = e.target.dataset.type;
                updateControlType(type);
                document.querySelectorAll(".control-type-btn").forEach(b => {
                    b.classList.remove("ring-2", "ring-white");
                });
                e.target.classList.add("ring-2", "ring-white");
                // Save to localStorage
                localStorage.setItem("snakeControlType", type);
            });
        });

        function updateControlType(type) {
            controlType = type;
            document.querySelectorAll("#mobileControls > div").forEach(control => {
                control.classList.add("hidden");
            });
            
            let description = "";
            switch(type) {
                case "joystick":
                    document.getElementById("joystickControl").classList.remove("hidden");
                    description = "Use joystick, keyboard arrows, or swipe to control";
                    break;
                case "arrows":
                    document.getElementById("arrowControls").classList.remove("hidden");
                    description = "Use arrow buttons, keyboard arrows, or swipe to control";
                    break;
                case "keyboard":
                    description = "Use keyboard arrows or swipe to control";
                    break;
                case "touch":
                    description = "Swipe anywhere or use keyboard arrows to control";
                    break;
            }
            document.getElementById("controlDescription").textContent = description;
        }

        function updateDifficulty(speed) {
            selectedSpeed = speed;
            gameSpeed = speed;
            if (game) {
                clearInterval(game);
                game = setInterval(draw, gameSpeed);
            }
        }

        function draw() {
            if (isPaused || isGameOver) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw food
            ctx.fillStyle = isBonusFood ? "gold" : "red";
            const foodSize = isBonusFood ? box * 1.5 : box;
            ctx.fillRect(food.x, food.y, foodSize, foodSize);
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "lime" : "green";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            
            let newX = snake[0].x;
            let newY = snake[0].y;
            
            if (direction === "UP") newY -= box;
            if (direction === "DOWN") newY += box;
            if (direction === "LEFT") newX -= box;
            if (direction === "RIGHT") newX += box;
            
            // Check collisions
            if (newX < 0 || newX >= canvas.width || newY < 0 || newY >= canvas.height || 
                snake.some(segment => segment.x === newX && segment.y === newY)) {
                endGame();
                return;
            }
            
            // Check food collision
            if (newX === food.x && newY === food.y) {
                score += 10;
                document.getElementById("currentScore").textContent = "Score: " + score;
                food = generateFood();
            } else {
                snake.pop();
            }
            
            snake.unshift({ x: newX, y: newY });
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * (canvas.width / box)) * box,
                    y: Math.floor(Math.random() * (canvas.height / box)) * box
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            return newFood;
        }

        function startGame() {
            // Reset game state
            snake = [{ x: 10 * box, y: 10 * box }];
            direction = "RIGHT";
            score = 0;
            document.getElementById("currentScore").textContent = "Score: " + score;
            food = generateFood();
            isPaused = false;
            isGameOver = false;
            
            // Hide menu and show game
            document.getElementById("menuScreen").classList.add("hidden");
            document.getElementById("settingsScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            
            // Start game loop
            if (game) clearInterval(game);
            game = setInterval(draw, gameSpeed);
        }

        function endGame() {
            clearInterval(game);
            game = null;
            isGameOver = true;
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                document.getElementById("highScore").textContent = "High Score: " + highScore;
            }
            
            // Show menu screen
            document.getElementById("gameScreen").classList.add("hidden");
            document.getElementById("menuScreen").classList.remove("hidden");
        }

        // Handle keyboard controls - always active
        document.addEventListener("keydown", (event) => {
            // Handle ESC key
            if (event.code === "Escape") {
                // If in game, end the game
                if (!isGameOver && document.getElementById("gameScreen").classList.contains("hidden") === false) {
                    endGame();
                    return;
                }
                
                // If in settings, go back to menu
                if (document.getElementById("settingsScreen").classList.contains("hidden") === false) {
                    document.getElementById("settingsScreen").classList.add("hidden");
                    document.getElementById("menuScreen").classList.remove("hidden");
                    return;
                }
            }
            
            // Handle Space key
            if (event.code === "Space") {
                event.preventDefault();
                togglePause();
                return;
            }
            
            // Handle arrow keys - always active
            if (!isPaused && !isGameOver) {
                if (event.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
                if (event.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
                if (event.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
                if (event.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
            }
        });

        // Touch controls - always active
        let touchStartX = null;
        let touchStartY = null;
        const touchThreshold = 30;

        document.addEventListener('touchstart', (e) => {
            if (!isGameOver) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (!isPaused && !isGameOver) {
                if (!touchStartX || !touchStartY) return;

                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const deltaX = currentX - touchStartX;
                const deltaY = currentY - touchStartY;

                if (Math.abs(deltaX) > touchThreshold || Math.abs(deltaY) > touchThreshold) {
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX > 0 && direction !== "LEFT") direction = "RIGHT";
                        if (deltaX < 0 && direction !== "RIGHT") direction = "LEFT";
                    } else {
                        if (deltaY > 0 && direction !== "UP") direction = "DOWN";
                        if (deltaY < 0 && direction !== "DOWN") direction = "UP";
                    }
                    
                    touchStartX = currentX;
                    touchStartY = currentY;
                }
            }
        });

        document.addEventListener('touchend', () => {
            touchStartX = null;
            touchStartY = null;
        });

        // Joystick controls - only active when joystick mode is selected
        const joystick = document.getElementById('joystick');
        const controlPad = document.getElementById('controlPad');
        let joystickActive = false;
        let joystickStartX = 0;
        let joystickStartY = 0;
        const maxJoystickMove = 33;

        controlPad.addEventListener('touchstart', (e) => {
            if (controlType !== "joystick" || isGameOver || isPaused) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const rect = controlPad.getBoundingClientRect();
            joystickStartX = touch.clientX - rect.left;
            joystickStartY = touch.clientY - rect.top;
            joystickActive = true;

            joystick.style.left = `${joystickStartX}px`;
            joystick.style.top = `${joystickStartY}px`;
        });

        controlPad.addEventListener('touchmove', (e) => {
            if (!joystickActive || isGameOver || isPaused) return;
            e.preventDefault();

            const touch = e.touches[0];
            const rect = controlPad.getBoundingClientRect();
            const currentX = touch.clientX - rect.left;
            const currentY = touch.clientY - rect.top;

            const deltaX = currentX - joystickStartX;
            const deltaY = currentY - joystickStartY;
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (distance > 10) {
                const degrees = angle * 180 / Math.PI;
                
                if (degrees > -135 && degrees <= -45) {
                    if (direction !== "DOWN") direction = "UP";
                } else if (degrees > -45 && degrees <= 45) {
                    if (direction !== "LEFT") direction = "RIGHT";
                } else if (degrees > 45 && degrees <= 135) {
                    if (direction !== "UP") direction = "DOWN";
                } else {
                    if (direction !== "RIGHT") direction = "LEFT";
                }

                const moveDistance = Math.min(distance, maxJoystickMove);
                const moveX = joystickStartX + Math.cos(angle) * moveDistance;
                const moveY = joystickStartY + Math.sin(angle) * moveDistance;
                
                joystick.style.left = `${moveX}px`;
                joystick.style.top = `${moveY}px`;
            }
        });

        controlPad.addEventListener('touchend', () => {
            joystickActive = false;
            joystick.style.left = '50%';
            joystick.style.top = '50%';
            joystick.style.transform = 'translate(-50%, -50%)';
        });

        // Arrow button controls
        document.querySelectorAll('.arrow-btn').forEach(btn => {
            let touchTimer = null;
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (controlType !== "arrows" || isGameOver || isPaused) return;
                
                const newDirection = e.target.dataset.direction;
                if (
                    (newDirection === "UP" && direction !== "DOWN") ||
                    (newDirection === "DOWN" && direction !== "UP") ||
                    (newDirection === "LEFT" && direction !== "RIGHT") ||
                    (newDirection === "RIGHT" && direction !== "LEFT")
                ) {
                    direction = newDirection;
                }
            });
        });

        function togglePause() {
            if (isGameOver) return;
            
            isPaused = !isPaused;
            const pauseBtn = document.getElementById("pauseBtn");
            
            if (isPaused) {
                clearInterval(game);
                game = null;
                pauseBtn.textContent = "Resume";
                pauseBtn.classList.remove("bg-yellow-500", "hover:bg-yellow-600");
                pauseBtn.classList.add("bg-green-500", "hover:bg-green-600");
            } else {
                game = setInterval(draw, gameSpeed);
                pauseBtn.textContent = "Pause";
                pauseBtn.classList.remove("bg-green-500", "hover:bg-green-600");
                pauseBtn.classList.add("bg-yellow-500", "hover:bg-yellow-600");
            }
        }
    </script>
</body>
</html>
